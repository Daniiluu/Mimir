<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'" />
  <title>Mimir — J.A.R.V.I.S. Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Custom Title Bar -->
  <header id="titlebar">
    <div class="drag-region"></div>
    <div class="titlebar-left">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" width="18" height="18">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#00d4ff" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="app-title">Mimir — J.A.R.V.I.S. Mode</span>
      <span class="sep">|</span>
      <span id="state-label" class="state-label">EN ESPERA</span>
    </div>
    <div class="titlebar-right">
      <button id="btn-min" class="win-btn" title="Minimizar">—</button>
      <button id="btn-max" class="win-btn" title="Maximizar">☐</button>
      <button id="btn-close" class="win-btn danger" title="Cerrar">✕</button>
    </div>
  </header>

  <!-- Main Layout -->
  <div id="app">

    <!-- Left: Reactor + Status -->
    <section id="reactor-panel">
      <div id="reactor-container">
        <div class="ring ring-4"></div>
        <div class="ring ring-3"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-1"></div>
        <div id="reactor-core">
          <div class="core-inner"></div>
        </div>
        <!-- Sound wave bars (shown when speaking) -->
        <div id="wave-bars">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div id="status-block">
        <p id="status-text">EN ESPERA</p>
        <p id="status-sub">Di <em>Hey Mimir</em> para activar</p>
      </div>

      <!-- Action Log -->
      <div id="action-log">
        <div class="log-header">
          <span class="dot"></span>
          <span>LOG DE ACCIONES</span>
        </div>
        <ul id="action-list"></ul>
      </div>
    </section>

    <!-- Right: Chat -->
    <section id="chat-panel">
      <div class="chat-header">
        <span>CONVERSACIÓN</span>
        <button id="btn-clear" class="clear-btn" title="Limpiar chat">✕</button>
      </div>
      <div id="chat-messages"></div>
      <div id="chat-placeholder">
        <svg viewBox="0 0 24 24" fill="none" width="40" height="40">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#1e2a3a" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <p>Aún no hay conversación.<br />Activa a Mimir con tu voz.</p>
      </div>
    </section>

  </div>

  <script src="renderer.js"></script>
</body>

</html>
